<title>Globo de Neve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: palco 3D em tela cheia; título discreto no canto, controles flutuando embaixo. */
:root{
  --scene-top:#efe4d4; --scene-bottom:#c7b39a;
  --sky-top:#8fa9cc; --sky-bottom:#efdccb;
  --ink:#2b2119; --muted:#6f5d4b;
  --chip:rgba(255,248,238,.74); --chip-line:rgba(70,48,30,.16);
  --accent:#9a5b2c; --on-accent:#fffaf3;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene-top:#2c221b; --scene-bottom:#0c0907;
    --sky-top:#0d1830; --sky-bottom:#3b3346;
    --ink:#f3e9dc; --muted:#bba78f;
    --chip:rgba(28,21,16,.68); --chip-line:rgba(255,232,205,.14);
    --accent:#e2b072; --on-accent:#1d150f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --scene-top:#2c221b; --scene-bottom:#0c0907;
  --sky-top:#0d1830; --sky-bottom:#3b3346;
  --ink:#f3e9dc; --muted:#bba78f;
  --chip:rgba(28,21,16,.68); --chip-line:rgba(255,232,205,.14);
  --accent:#e2b072; --on-accent:#1d150f; color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--scene-bottom);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.dragging{cursor:grabbing}
.head{position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);
  left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:4px;pointer-events:none}
.head h1{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.01em;line-height:1.1}
.head p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;max-width:40ch;transition:opacity .8s ease}
.head p.faded{opacity:0}
.bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);
  display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--chip);border:1px solid var(--chip-line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);max-width:calc(100vw - 32px)}
.bar button{font:500 14px/1 var(--body);color:var(--ink);background:transparent;border:0;border-radius:999px;
  padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}
.bar button:hover{background:var(--chip-line)}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar button.primary{background:var(--accent);color:var(--on-accent)}
.bar button.primary:hover{filter:brightness(1.08);background:var(--accent)}
.bar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:460px){ .bar button{padding:11px 10px;font-size:13px} .bar button .lbl-long{display:none} }
.meter{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  font:500 12px/1 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;pointer-events:none}
.meter i{display:block;width:54px;height:4px;border-radius:2px;background:var(--chip-line);overflow:hidden}
.meter i b{display:block;height:100%;width:0;background:var(--accent);transition:width .15s linear}
@media (max-width:640px){ .meter{display:none} }
#veil{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.97), rgba(226,238,252,.9) 55%, rgba(196,214,238,.88))}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;pointer-events:none}
</style>

<canvas id="c" tabindex="0" aria-label="Globo de neve 3D. Arraste para girar, use a roda do mouse ou pinça para aproximar."></canvas>
<div id="veil"></div>
<div id="loading">Montando o globo…</div>
<div class="head">
  <h1 id="title">Globo de Neve</h1>
  <p id="hint">Arraste para girar e sacuda para soltar a neve. Toque em “Entrar no globo” para explorar o mundo que existe lá dentro.</p>
</div>
<div class="bar">
  <button id="shake" type="button" title="Dar uma sacudida rápida">
    <svg viewBox="0 0 24 24"><path d="M4 12c2-4 4-4 6 0s4 4 6 0 4-4 4-4"/><path d="M4 18c2-3 4-3 6 0s4 3 6 0"/></svg>Sacudir
  </button>
  <button id="upright" type="button" title="Voltar o globo para a posição de pé">
    <svg viewBox="0 0 24 24"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg>Endireitar
  </button>
  <button id="expand" type="button" class="primary" title="Entrar no mundo dentro do globo">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg><span id="expandLbl">Entrar <span class="lbl-long">no globo</span></span>
  </button>
</div>
<div class="meter" id="meter" aria-hidden="true">Neve no ar <i><b id="meterbar"></b></i></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// =====================================================================
// Renderer, cena, luzes
// =====================================================================
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

function gradTex(){ const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const bgGlobe = gradTex(), bgWorld = gradTex();
const fogColor = new THREE.Color();
function paint(tex, a, b){
  const g = tex.image.getContext('2d'), grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0, a); grd.addColorStop(1, b); g.fillStyle = grd; g.fillRect(0, 0, 4, 256); tex.needsUpdate = true;
}
function paintBackgrounds(){
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  paint(bgGlobe, v('--scene-top') || '#2c221b', v('--scene-bottom') || '#0c0907');
  paint(bgWorld, v('--sky-top') || '#0d1830', v('--sky-bottom') || '#3b3346');
  fogColor.set(v('--sky-bottom') || '#3b3346');
}
paintBackgrounds(); scene.background = bgGlobe;
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintBackgrounds); } catch (e) {}
new MutationObserver(paintBackgrounds).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 80);

scene.add(new THREE.HemisphereLight(0xfff0dc, 0x3b2a1f, 0.45));
const key = new THREE.DirectionalLight(0xffe4c4, 2.4);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.015; key.shadow.radius = 4;
scene.add(key); scene.add(key.target);
const rim = new THREE.DirectionalLight(0xc4d8ff, 0.9); rim.position.set(-3, 2.2, -3.2); scene.add(rim);
function setShadowFrame(half, dist){
  key.position.set(0.55, 1, 0.7).normalize().multiplyScalar(dist);
  Object.assign(key.shadow.camera, { left: -half, right: half, top: half, bottom: -half, near: 0.5, far: dist * 2.2 });
  key.shadow.camera.updateProjectionMatrix();
}
setShadowFrame(1.4, 5);

// =====================================================================
// Utilidades
// =====================================================================
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = a => a[Math.floor(rnd() * a.length)];
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function jit(hex, l = 0.03, h = 0.008){
  const c = new THREE.Color(hex), hsl = {}; c.getHSL(hsl);
  return new THREE.Color().setHSL(hsl.h + (rnd() - .5) * h, hsl.s, THREE.MathUtils.clamp(hsl.l + (rnd() - .5) * 2 * l, 0, 1));
}
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf);
  const a = hash2(xi, yi), b = hash2(xi+1, yi), c = hash2(xi, yi+1), d = hash2(xi+1, yi+1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.1 + 7, y * 2.1 + 3) * 0.3 + vnoise(x * 4.3 + 1, y * 4.3 + 9) * 0.15;

// Quadro de montagem: tudo que é adicionado passa por posição, giro (Y) e escala.
const F = { x: 0, y: 0, z: 0, r: 0, s: 1, c: 1, sn: 0 };
function setFrame(x, y, z, r = 0, s = 1){ Object.assign(F, { x, y, z, r, s, c: Math.cos(r), sn: Math.sin(r) }); }

// Efeito "o mundo se cria": cada bloco nasce do centro para fora
const revealU = { value: 1e3 };
function patchReveal(shader){
  shader.uniforms.uReveal = revealU;
  shader.vertexShader = 'attribute float aDist;\nuniform float uReveal;\n' + shader.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
    float rk = clamp((uReveal - aDist) / 0.5, 0.0, 1.0);
    float rs = rk >= 1.0 ? 1.0 : (1.0 - pow(1.0 - rk, 3.0)) * (1.0 + 0.35 * sin(rk * 3.14159));
    transformed *= rs;`);
}
const revealCache = new Map();
function revealMat(m){
  if (!revealCache.has(m)){ const c = m.clone(); c.onBeforeCompile = patchReveal; c.customProgramCacheKey = () => 'reveal'; revealCache.set(m, c); }
  return revealCache.get(m);
}
const depthReveal = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
depthReveal.onBeforeCompile = patchReveal; depthReveal.customProgramCacheKey = () => 'reveal-depth';

const tmpC = new THREE.Color();
class Blocks {
  constructor(geo, mat, { cast = true, receive = true } = {}){ Object.assign(this, { geo, mat, cast, receive, items: [] }); }
  add(x, y, z, sx, sy, sz, color, ry = 0, rx = 0, rz = 0){
    this.items.push([F.x + (F.c * x + F.sn * z) * F.s, F.y + y * F.s, F.z + (-F.sn * x + F.c * z) * F.s,
      sx * F.s, sy * F.s, sz * F.s, color, rx, ry + F.r, rz]);
  }
  build(parent, reveal = false){
    if (!this.items.length) return null;
    const geo = reveal ? this.geo.clone() : this.geo;
    const m = new THREE.InstancedMesh(geo, reveal ? revealMat(this.mat) : this.mat, this.items.length);
    const o = new THREE.Object3D(); o.rotation.order = 'YXZ';
    const dist = reveal ? new Float32Array(this.items.length) : null;
    this.items.forEach((it, i) => {
      o.position.set(it[0], it[1], it[2]); o.scale.set(it[3], it[4], it[5]); o.rotation.set(it[7], it[8], it[9]); o.updateMatrix();
      m.setMatrixAt(i, o.matrix); m.setColorAt(i, it[6] instanceof THREE.Color ? it[6] : tmpC.set(it[6]));
      if (dist) dist[i] = Math.hypot(it[0], it[2]) + Math.max(0, it[1]) * 0.35 + Math.random() * 0.15;
    });
    if (dist){ geo.setAttribute('aDist', new THREE.InstancedBufferAttribute(dist, 1)); m.customDepthMaterial = depthReveal; }
    m.castShadow = this.cast; m.receiveShadow = this.receive; m.frustumCulled = !reveal;
    m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true;
    parent.add(m); return m;
  }
}

// =====================================================================
// Materiais e geometrias dos mini blocos
// =====================================================================
const geoFine = new RoundedBoxGeometry(1, 1, 1, 2, 0.16);
const geoLite = new RoundedBoxGeometry(1, 1, 1, 1, 0.18);
const geoStud = new THREE.CylinderGeometry(0.5, 0.5, 1, 12, 1);

function grainTexture(){
  const W = 256, cv = document.createElement('canvas'); cv.width = W; cv.height = W;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, W), d = img.data;
  for (let y = 0; y < W; y++) for (let x = 0; x < W; x++){
    const n = fbm(x * 0.02, y * 0.15);
    const ring = Math.sin(y * 0.22 + n * 9) * 0.5 + 0.5;
    const fiber = vnoise(x * 0.9, y * 0.06);
    const v = 0.62 + 0.26 * Math.pow(ring, 1.6) + 0.12 * fiber;
    const o = (y * W + x) * 4; d[o] = d[o + 1] = d[o + 2] = Math.min(255, v * 255); d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const matBlock = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.62 });
const matSnow  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.92 });
const matIce   = new THREE.MeshPhysicalMaterial({ color: 0xdcefff, roughness: 0.08, clearcoat: 1, clearcoatRoughness: .05 });
const matGlow  = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matGold  = new THREE.MeshStandardMaterial({ color: 0xd6a94e, roughness: 0.28, metalness: 1 });
const matWood  = new THREE.MeshPhysicalMaterial({ color: 0xffffff, map: grainTexture(), roughness: 0.48, clearcoat: 0.55, clearcoatRoughness: 0.28 });

function makeSets(){
  return {
    B:  new Blocks(geoFine, matBlock),
    BL: new Blocks(geoLite, matBlock),
    SN: new Blocks(geoLite, matSnow),
    ST: new Blocks(geoStud, matBlock),
    IC: new Blocks(geoLite, matIce, { cast: false }),
    GL: new Blocks(geoLite, matGlow, { cast: false, receive: false }),
    GD: new Blocks(geoFine, matGold),
    WD: new Blocks(geoFine, matWood),
  };
}
const buildSets = (S, parent, reveal) => Object.values(S).forEach(c => c.build(parent, reveal));
const warm = (r, g, b, k) => new THREE.Color(r, g, b).multiplyScalar(k);

// =====================================================================
// Peças do cenário (coordenadas locais, chão em y = 0)
// =====================================================================
const STYLES = {
  brick:  { bricks: ['#a5503a','#b35b42','#9b4935','#bc684c','#a95a41','#94442f'], quoin: '#e6d9c2', roof: ['#5b2c27','#6a332b','#4f2622','#723a30'], door: '#2d5a3f', shutter: '#2d5a3f' },
  stone:  { bricks: ['#d9cfbf','#cfc3b0','#e3dacb','#c7bba7','#d2c8b7'], quoin: '#9f978b', roof: ['#3e4a5c','#465469','#37414f','#4c5a6e'], door: '#7a2f2a', shutter: '#7a2f2a' },
  timber: { bricks: ['#6f4a32','#7b5338','#664430','#835a3c','#5f3f2b'], quoin: '#4c3222', roof: ['#2f3a33','#36433a','#29332d','#3c4a40'], door: '#b5892e', shutter: '#b13a2e' },
  plaster:{ bricks: ['#e8c57a','#e1bb6c','#edcd88','#dcb465','#e6c174'], quoin: '#f3ead8', roof: ['#7c3b2c','#8a4332','#6f3427','#96503b'], door: '#33507a', shutter: '#33507a' },
};

function addHouse(S, o){
  const st = STYLES[o.style || 'brick'];
  const W = o.W, D = o.D, ROWS = o.rows || 10, BLn = 0.06, BH = 0.03, BD = 0.03, G = 0.004;
  const Y0 = 0.032, Y1 = Y0 + ROWS * BH;
  const PITCH = 0.6, TANP = Math.tan(PITCH), COSP = Math.cos(PITCH), SINP = Math.sin(PITCH);
  const OV = 0.05, OVX = 0.045, YR = Y1 + (D / 2) * TANP + 0.02;
  const frameWhite = '#f2efe8';

  // fundação
  for (const side of [-1, 1]){
    for (let x = -W/2 - 0.01; x < W/2 + 0.01; x += 0.08){
      const l = Math.min(0.08, W/2 + 0.01 - x);
      S.B.add(x + l/2, 0.016, side * (D/2 + 0.005), l - G, 0.03, 0.04, jit('#8f8a84', .05));
    }
    for (let z = -D/2 + 0.025; z < D/2 - 0.025; z += 0.08){
      const l = Math.min(0.08, D/2 - 0.025 - z);
      S.B.add(side * (W/2 + 0.005), 0.016, z + l/2, 0.04, 0.03, l - G, jit('#8f8a84', .05));
    }
  }
  const walls = {
    front: { axis: 'x', fixed:  D/2 - BD/2, n: [0, 0,  1] },
    back:  { axis: 'x', fixed: -D/2 + BD/2, n: [0, 0, -1] },
    right: { axis: 'z', fixed:  W/2 - BD/2, n: [ 1, 0, 0] },
    left:  { axis: 'z', fixed: -W/2 + BD/2, n: [-1, 0, 0] },
  };
  const wx = W * 0.3, r1 = ROWS - 3;
  const openings = {
    front: [{ a: -0.045, b: 0.045, r0: 0, r1: Math.min(6, ROWS - 4), door: true }, { a: -wx - 0.045, b: -wx + 0.045, r0: 3, r1 }, { a: wx - 0.045, b: wx + 0.045, r0: 3, r1 }],
    back:  [{ a: -0.05, b: 0.05, r0: 3, r1 }],
    right: [{ a: -0.045, b: 0.045, r0: 3, r1 }],
    left:  [{ a: -0.045, b: 0.045, r0: 3, r1 }],
  };
  const wp = (w, s, off) => { const wl = walls[w];
    return wl.axis === 'x' ? [s, wl.fixed + wl.n[2] * off] : [wl.fixed + wl.n[0] * off, s]; };
  function onWall(coll, w, s, y, off, len, h, dep, color, ex = {}){
    const [x, z] = wp(w, s, off);
    if (walls[w].axis === 'x') coll.add(x, y, z, len, h, dep, color, ex.ry || 0, ex.rx || 0, ex.rz || 0);
    else coll.add(x, y, z, dep, h, len, color, (ex.ry || 0), ex.rz || 0, ex.rx || 0);
  }
  function subtract(a, b, holes){
    let segs = [[a, b]];
    for (const h of holes){
      const out = [];
      for (const [s0, s1] of segs){
        if (h.b <= s0 || h.a >= s1){ out.push([s0, s1]); continue; }
        if (h.a > s0) out.push([s0, h.a]);
        if (h.b < s1) out.push([h.b, s1]);
      }
      segs = out;
    }
    return segs;
  }
  function layRow(w, row, s0, s1, y, holes, shift){
    let pos = s0, first = true;
    while (pos < s1 - 0.001){
      const len = first ? BLn * (shift ? 0.5 : 1) : BLn; first = false;
      const end = Math.min(pos + len, s1);
      for (const [a, b] of subtract(pos, end, holes)){
        if (b - a < 0.012) continue;
        const corner = a < s0 + 0.002 || b > s1 - 0.002;
        const col = corner && row % 2 === 0 ? jit(st.quoin, .02) : jit(pick(st.bricks), .025);
        onWall(S.B, w, (a + b) / 2, y, 0, (b - a) - G, BH - G, BD - G, col);
      }
      pos = end;
    }
  }
  // paredes com cantos intertravados
  for (let r = 0; r < ROWS; r++){
    const y = Y0 + r * BH + BH / 2, even = r % 2 === 0;
    for (const w of Object.keys(walls)){
      let s0;
      if (walls[w].axis === 'x') s0 = even ? -W/2 : -W/2 + BD; else s0 = even ? -D/2 + BD : -D/2;
      layRow(w, r, s0, -s0, y, openings[w].filter(o => r >= o.r0 && r <= o.r1), r % 2 === 1);
    }
  }
  // oitões
  for (const w of ['left', 'right']){
    for (let k = 0; ; k++){
      const hw = D/2 - (k + 0.7) * BH / TANP; if (hw < 0.02) break;
      layRow(w, ROWS + k, -hw, hw, Y1 + k * BH + BH / 2, [], k % 2 === 0);
    }
  }
  // portas e janelas
  for (const w of Object.keys(openings)){
    for (const op of openings[w]){
      const ya = Y0 + op.r0 * BH, yb = Y0 + (op.r1 + 1) * BH, len = op.b - op.a, hgt = yb - ya, sc = (op.a + op.b) / 2, yc = (ya + yb) / 2;
      onWall(S.B, w, sc, yb - 0.006, 0.002, len + 0.026, 0.014, BD + 0.008, jit(frameWhite, .01));
      onWall(S.B, w, op.a + 0.005, yc, 0.002, 0.012, hgt - 0.01, BD + 0.006, jit(frameWhite, .01));

      } else {

        onWall(S.B, w, sc, yc, 0.004, len - 0.012, 0.007, 0.01, jit(frameWhite, .01));

        if (w === 'front'){

      S.SN.add(x, ye + 0.008, ze, 0.036 + rnd() * 0.02, 0.016, 0.03, '#fbfcfe', 0, sg * PITCH);
      if (rnd() < 0.6){ const L = 0.015 + rnd() * 0.04; S.IC.add(x + (rnd() - .5) * 0.02, ye - L / 2 - 0.004, ze + sg * 0.006, 0.007, L, 0.007, '#ffffff'); }
    }
    for (const ex of [-1, 1])
      for (let s = 0; s < Ls; s += 0.04)
        S.B.add(ex * (W/2 + OVX + 0.004), YR - (s + 0.02) * SINP - 0.012, sg * (s + 0.02) * COSP, 0.01, 0.022, 0.04, jit(frameWhite, .01), 0, sg * PITCH);

    }
    S.B.add(CX, CTOP + 0.007, CZ, CW + 0.014, 0.014, CW + 0.014, jit('#5d5a57', .03));

  }
  return { W, D, Y0, Y1, YR, TANP, OV, OVX, CX, CZ, CW, CTOP };
}

function addTree(S, cx, cz, h, r, opt = {}){
  const lite = !!opt.lite, step = lite ? 0.032 : 0.025, bs = lite ? 0.04 : 0.03, sp = lite ? 0.042 : 0.03;
  for (let k = 0; k < 3; k++) S.BL.add(cx, 0.015 + k * 0.03, cz, 0.034, 0.028, 0.034, jit('#5a3a22', .04));
  const y0 = 0.07, L = Math.max(3, Math.round((h - 0.07) / step));
  const lightCols = [[1, .25, .2], [1, .78, .3], [.35, .6, 1], [1, .5, .8]];
  const greens = opt.greens || ['#2f5d3a', '#376a43', '#28513a', '#3f7348'];
  for (let i = 0; i < L; i++){
    const f = i / L, tier = (i % 4) / 3;
    const rad = r * (1 - f) * (1 - 0.24 * tier) + 0.014, y = y0 + i * step;
    const rings = [rad]; if (rad - sp > 0.025) rings.push(rad - sp);
    if (rings[rings.length - 1] > 0.035) rings.push(0);
    for (const rr of rings){
      const n = rr === 0 ? 1 : Math.max(4, Math.round(2 * Math.PI * rr / sp));
      for (let k = 0; k < n; k++){
        const a = k / n * Math.PI * 2 + i * 0.37 + rr * 7, x = cx + Math.cos(a) * rr, z = cz + Math.sin(a) * rr;
        const outer = rr === rad, snowy = (outer && tier > 0.6 && rnd() < 0.6) || i === L - 1;
        if (snowy) S.SN.add(x, y + 0.004, z, bs * 1.03, bs * 0.74, bs * 1.03, jit('#f6f8fb', .015), -a);
        else S.BL.add(x, y, z, bs, bs * 0.77, bs, jit(pick(greens), .035), -a);
        if (opt.lights && outer && rnd() < 0.1){
          const lc = pick(lightCols);
          S.GL.add(cx + Math.cos(a) * (rr + 0.017), y, cz + Math.sin(a) * (rr + 0.017), 0.011, 0.011, 0.011, warm(lc[0], lc[1], lc[2], 1.5));
        }
      }
    }
  }
  const top = y0 + L * step;
  if (opt.star){
    S.GD.add(cx, top + 0.02, cz, 0.03, 0.03, 0.01, '#ffffff', 0, 0, Math.PI / 4);
    S.GD.add(cx, top + 0.02, cz, 0.03, 0.03, 0.01, '#ffffff');
    S.GL.add(cx, top + 0.02, cz, 0.014, 0.014, 0.014, warm(1, .85, .5, 1.6));
  }
  for (let k = 0; k < (lite ? 5 : 12); k++){
    const a = rnd() * Math.PI * 2, d = r * (0.8 + rnd() * 0.5);
    S.SN.add(cx + Math.cos(a) * d, 0.006, cz + Math.sin(a) * d, 0.03 + rnd() * 0.03, 0.012 + rnd() * 0.01, 0.03 + rnd() * 0.02, '#f7f9fc', a);
  }
  return { y0, top, rEff: r + 0.016 };
}

function addSnowman(S, sx, sz, rot = 0.3, scarf = '#b3242a'){
  const w0 = '#f6f8fb';
  S.B.add(sx, 0.043, sz, 0.086, 0.086, 0.086, jit(w0, .01), rot - 0.1);
  S.B.add(sx, 0.118, sz, 0.064, 0.064, 0.064, jit(w0, .01), rot + 0.15);
  S.B.add(sx, 0.152, sz, 0.072, 0.012, 0.072, scarf, rot);
  S.B.add(sx, 0.183, sz, 0.05, 0.05, 0.05, jit(w0, .01), rot);
  const fx = Math.sin(rot), fz = Math.cos(rot), qx = Math.cos(rot), qz = -Math.sin(rot);
  for (const e of [-1, 1]) S.B.add(sx + fx * 0.026 + qx * e * 0.012, 0.19, sz + fz * 0.026 + qz * e * 0.012, 0.007, 0.007, 0.004, '#1b1b1d', rot);
  S.B.add(sx + fx * 0.04, 0.18, sz + fz * 0.04, 0.008, 0.008, 0.03, '#e07a26', rot);
  for (const k of [0, 1]) S.B.add(sx + Math.sin(rot + .15) * 0.033, 0.105 + k * 0.022, sz + Math.cos(rot + .15) * 0.033, 0.008, 0.008, 0.004, '#1b1b1d', rot + .15);
  S.B.add(sx, 0.212, sz, 0.062, 0.008, 0.062, '#1b1b1d', rot);
  S.B.add(sx, 0.234, sz, 0.04, 0.036, 0.04, '#1b1b1d', rot);
  S.ST.add(sx, 0.255, sz, 0.014, 0.005, 0.014, '#1b1b1d');
}
function addGift(S, gx, gz, s, col){
  S.B.add(gx, s / 2, gz, s, s, s, jit(col, .02), 0.3);
  S.GD.add(gx, s / 2, gz, s + 0.003, s + 0.002, 0.008, '#ffffff', 0.3);

  S.GD.add(gx, s + 0.005, gz, 0.014, 0.008, 0.014, '#ffffff', 1.1);
}
function addLamp(S, x, z){
  for (let y = 0; y < 0.23; y += 0.025) S.BL.add(x, y + 0.0125, z, 0.014, 0.024, 0.014, '#2a2a2e');

}

    if (y < h){
      const b = hit && hit.box;
      if (b && y < h - 0.05 && x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1){
        const dl = x - b.x0, dr = b.x1 - x, db = z - b.z0, df = b.z1 - z, m = Math.min(dl, dr, db, df);
        if (m === dl){ x = b.x0; if (vx > 0) vx *= -0.2; }
        else if (m === dr){ x = b.x1; if (vx < 0) vx *= -0.2; }
        else if (m === db){ z = b.z0; if (vz > 0) vz *= -0.2; }
        else { z = b.z1; if (vz < 0) vz *= -0.2; }
      } else {
        y = h + Math.random() * 0.01;
        if (vy < 0) vy *= -0.15;
        if (-gy > 0.4 && settleOK){ settled = true; RN[o] = 0; RN[o + 1] = 1; RN[o + 2] = 0; }
      }
    }
    if (settled){ state[i] = 1; vx = vy = vz = 0; }
    P[o] = x; P[o + 1] = y; P[o + 2] = z; V[o] = vx; V[o + 1] = vy; V[o + 2] = vz;
  }
  posAttr.needsUpdate = true;
  return airborne / N;
}

// =====================================================================
// Tamanho da tela
// =====================================================================
function updateProj(){
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const tanG = Math.tan(THREE.MathUtils.degToRad(16)), tanW = Math.tan(THREE.MathUtils.degToRad(21));
  baseDist = Math.max(1.62 / tanG, 1.3 / (tanG * camera.aspect));
  worldDist = Math.min(17, Math.max(9.2, 3.4 / (tanW * camera.aspect)));
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  snowMat.uniforms.uScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * tanH);
}
function resize(){ renderer.setSize(window.innerWidth, window.innerHeight, false); updateProj(); }
window.addEventListener('resize', resize); resize(); camDist = baseDist;

// =====================================================================
// Loop
// =====================================================================
const meterBar = document.getElementById('meterbar');
const clock = new THREE.Clock();
const IDQ = new THREE.Quaternion();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 30); tSim += dt;

  if (!dragging && inertia.lengthSq() > 1e-6){ turn(inertia.x * dt, inertia.y * dt); inertia.multiplyScalar(Math.exp(-dt * 4.5)); }
  if (shakeT >= 0){
    shakeT += dt;
    const T = 1.1, env = Math.max(0, 1 - shakeT / T), ang = 0.32 * env * Math.sin(shakeT * Math.PI * 2 * 3.4);
    qA.setFromAxisAngle(shakeAxis, ang - shakePrev); globe.quaternion.premultiply(qA); shakePrev = ang;
    if (shakeT > T) shakeT = -1;
  }
  if (uprightAnim){
    uprightAnim.t = Math.min(1, uprightAnim.t + dt / 0.9);
    globe.quaternion.slerpQuaternions(uprightAnim.from, IDQ, 1 - Math.pow(1 - uprightAnim.t, 3));
    if (uprightAnim.t >= 1) uprightAnim = null;
  }

  // transições
  if (mode === 'toWorld'){
    trans += dt;
    const k = Math.min(1, trans / 1.0);
    if (!switched) camDist += (baseDist * 0.24 - camDist) * (1 - Math.exp(-dt * 4));
    veil.style.opacity = smooth(0.45, 1.0, trans).toFixed(3);
    if (k >= 1 && !switched){ switched = true; enterWorldScene(); }
    if (switched){ veil.style.opacity = (1 - smooth(1.0, 1.6, trans)).toFixed(3); if (trans > 1.6){ mode = 'world'; veil.style.opacity = 0; } }
  } else if (mode === 'toGlobe'){
    trans += dt;
    if (!switched) camDist += (worldDist * 0.3 - camDist) * (1 - Math.exp(-dt * 3));
    veil.style.opacity = smooth(0, 0.45, trans).toFixed(3);
    if (trans >= 0.45 && !switched){ switched = true; enterGlobeScene(); }
    if (switched){ veil.style.opacity = (1 - smooth(0.5, 1.1, trans)).toFixed(3); if (trans > 1.1){ mode = 'globe'; veil.style.opacity = 0; } }
  }

  const inWorld = world && world.visible;
  if (!inWorld){
    // velocidade angular real do globo -> redemoinho do líquido
    dq.copy(globe.quaternion).multiply(qInv.copy(prevQ).invert());
    if (dq.w < 0){ dq.x = -dq.x; dq.y = -dq.y; dq.z = -dq.z; dq.w = -dq.w; }
    const ang = 2 * Math.acos(Math.min(1, dq.w)), sn = Math.sqrt(Math.max(0, 1 - dq.w * dq.w));
    if (sn > 1e-6) omegaRaw.set(dq.x / sn, dq.y / sn, dq.z / sn).multiplyScalar(ang / dt); else omegaRaw.set(0, 0, 0);
    prevQ.copy(globe.quaternion);
    omegaPrev.copy(omega); omega.lerp(omegaRaw, 1 - Math.exp(-dt / 0.045));
    fluid.lerp(omega, 1 - Math.exp(-dt / 1.7));
    swirlW.copy(fluid).sub(omega);
    E = Math.min(1.6, E + omegaPrev.distanceTo(omega) * 0.22 + swirlW.length() * dt * 0.22);
    E *= Math.exp(-dt / 2.4);
    qInv.copy(globe.quaternion).invert();
    swirl.copy(swirlW).applyQuaternion(qInv);
    g.set(0, -1, 0).applyQuaternion(qInv);
    const air = stepSnow(dt);
    meterBar.style.width = Math.round(Math.min(1, air * 1.6) * 100) + '%';
    if (mode === 'globe' || (mode === 'toGlobe' && switched)) camDist += (baseDist * zoom - camDist) * (1 - Math.exp(-dt * (mode === 'globe' ? 8 : 3.5)));
    camera.position.copy(camDir).multiplyScalar(camDist).add(camTargetG);
    camera.lookAt(camTargetG);
  } else {
    // o mundo nasce do centro para fora enquanto a câmera se afasta
    revealT += dt; revealU.value = -0.5 + (WR + 2.2) * smooth(0, 2.8, revealT);
    worldIntro = Math.min(1, worldIntro + dt / 2.6);
    if (mode === 'world' || (mode === 'toWorld' && switched)) camDist += (worldDist * wzoom - camDist) * (1 - Math.exp(-dt * (worldIntro < 1 ? 1.6 : 6)));
    stepWorldSnow(dt, tSim);
    const cp = Math.cos(orbit.pitch);
    camera.position.set(Math.sin(orbit.yaw) * cp, Math.sin(orbit.pitch), Math.cos(orbit.yaw) * cp).multiplyScalar(camDist).add(camTargetW);
    camera.lookAt(camTargetW);
  }
  renderer.render(scene, camera);
});
document.getElementById('loading').remove();
</script>
