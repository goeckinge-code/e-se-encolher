<!doctype html>
<html lang="pt-BR" data-nav-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Edição Inverno</title>
  <link rel="preload" href="fontes/inter-tight-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fontes/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fontes/imperial-script-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="vendor/lenis.css" />
  <link rel="stylesheet" href="css/estilo.css" />
</head>
<body data-iniciado="false" data-rolou="false" data-carregado="false">
  <!-- 1. Fundo WebGL (fixo, atrás de tudo) + fallback em CSS -->
  <canvas id="cena" aria-hidden="true"></canvas>
  <div id="fundo-css" aria-hidden="true"></div>

  <!-- 2. Navegação -->
  <header class="nav" id="nav">
    <div class="nav__esq">
      <a class="nav__marca nav-item" href="#topo">
        <span class="nav__logo" aria-hidden="true"></span>
        <strong data-marca-nome></strong>
        <span class="nav__edicao" data-marca-edicao></span>
      </a>
      <button class="navButton nav-item nav__so-desk" type="button">Edições <span class="seta">▾</span></button>
      <button class="navButton nav-item nav__so-desk" type="button">Buscar <span class="lupa" aria-hidden="true"></span></button>
    </div>
    <div class="nav__dir">
      <a class="navButton nav-item nav__so-desk" data-link-site></a>
      <a class="roundedButton nav-item" data-cta></a>
      <button class="nav__menu nav-item" type="button" aria-label="Menu"><span></span><span></span></button>
    </div>
  </header>

  <!-- 3. Abertura: linhas "da Vinci" + caixa com título e índice -->
  <div class="davinci" aria-hidden="true">
    <svg class="davinci__linhas" id="linhas"></svg>
  </div>
  <div class="caixa" id="topo">
    <h1 class="caixa__titulo titulo" data-titulo></h1>
    <div class="caixa__base">
      <p class="caixa__sub narrativa-3" data-subtitulo></p>
      <ol class="indice" data-indice></ol>
    </div>
  </div>

  <!-- 4. Barra lateral (aparece depois do primeiro scroll) -->
  <aside class="lateral" id="lateral">
    <a class="lateral__titulo titulo" href="#topo" data-titulo></a>
    <ol class="indice" data-indice></ol>
    <div class="lateral__rodape"><strong data-marca-nome></strong><br /><span data-legal></span></div>
  </aside>

  <!-- 5. Capítulos (gerados a partir do conteudo.js) -->
  <main id="principal">
    <div class="espaco-abertura"></div>
  </main>

  <footer class="rodape" data-nav-theme="dark" id="rodape"></footer>

  <script src="conteudo.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script src="js/montar.js"></script>
  <script src="js/cena.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
